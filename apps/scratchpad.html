<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Scratchpad</title>
<link href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=B612+Mono&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#050b14; --panel:#0e1e33; --line:#1f3d63; --text:#e6f1ff; --dim:#7f97b5;
          --cyan:#19d3ff; --amber:#ffb300; --green:#2dff6e; --red:#ff3b3b; --font:"B612",system-ui,sans-serif; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:var(--font); overflow:hidden; user-select:none; }
  .wrap { display:flex; flex-direction:column; height:100%; }
  .tools { display:flex; align-items:center; gap:8px; padding:8px 10px; background:#0a1626; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .tools button { height:42px; min-width:42px; padding:0 12px; border-radius:8px; border:1px solid var(--line);
                  background:var(--panel); color:var(--cyan); font:inherit; font-size:12px; letter-spacing:1px; cursor:pointer; }
  .tools button.on { border-color:var(--green); box-shadow:inset 0 -3px 0 var(--green); }
  .tools .sw { width:42px; padding:0; }
  .tools .sw i { display:block; width:22px; height:22px; margin:auto; border-radius:50%; background:var(--c); }
  .sp { flex:1; }
  .sep { width:1px; height:30px; background:var(--line); }
  #board { position:relative; flex:1; touch-action:none; }
  canvas { position:absolute; inset:0; width:100%; height:100%; }
  #tpl { pointer-events:none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="tools">
    <button class="sw on" data-c="#ffffff" style="--c:#ffffff"><i></i></button>
    <button class="sw" data-c="#19d3ff" style="--c:#19d3ff"><i></i></button>
    <button class="sw" data-c="#2dff6e" style="--c:#2dff6e"><i></i></button>
    <button class="sw" data-c="#ffb300" style="--c:#ffb300"><i></i></button>
    <button class="sw" data-c="#ff4dff" style="--c:#ff4dff"><i></i></button>
    <span class="sep"></span>
    <button id="thin">THIN</button>
    <button id="thick" class="on">THICK</button>
    <button id="eraser">ERASER</button>
    <span class="sp"></span>
    <button id="tplBtn">CRAFT</button>
    <button id="undo">UNDO</button>
    <button id="clear" style="color:var(--red)">CLEAR</button>
  </div>
  <div id="board">
    <canvas id="tpl"></canvas>
    <canvas id="ink"></canvas>
  </div>
</div>
<script>
const board = document.getElementById('board');
const ink = document.getElementById('ink'), tpl = document.getElementById('tpl');
const ctx = ink.getContext('2d'), tctx = tpl.getContext('2d');
const KEY = 'efb.scratchpad';
let color = '#ffffff', width = 3.5, erasing = false, showTpl = localStorage.getItem(KEY + '.tpl') === '1';
let history = [], initialized = false;

function resize() {
  const saved = initialized ? ink.toDataURL() : localStorage.getItem(KEY);
  initialized = true;
  const dpr = window.devicePixelRatio || 1;
  const { width: w, height: h } = board.getBoundingClientRect();
  [ink, tpl].forEach((c) => { c.width = w * dpr; c.height = h * dpr; c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0); });
  drawTemplate();
  if (saved) { const img = new Image(); img.onload = () => { ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(img, 0, 0); ctx.restore(); }; img.src = saved; }
}

function drawTemplate() {
  const { width: w, height: h } = board.getBoundingClientRect();
  tctx.clearRect(0, 0, w, h);
  document.getElementById('tplBtn').classList.toggle('on', showTpl);
  if (!showTpl) return;
  const rows = ['C  CLEARANCE LIMIT', 'R  ROUTE', 'A  ALTITUDE', 'F  FREQUENCY', 'T  TRANSPONDER'];
  const rh = h / rows.length;
  tctx.font = '13px B612, sans-serif';
  rows.forEach((t, i) => {
    tctx.fillStyle = '#7f97b5'; tctx.fillText(t, 12, i * rh + 20);
    tctx.strokeStyle = '#1f3d63'; tctx.lineWidth = 1;
    tctx.beginPath(); tctx.moveTo(0, (i + 1) * rh); tctx.lineTo(w, (i + 1) * rh); tctx.stroke();
  });
}

function persist() { try { localStorage.setItem(KEY, ink.toDataURL()); } catch {} }

let drawing = false, last = null;
ink.addEventListener('pointerdown', (e) => {
  drawing = true; last = { x: e.offsetX, y: e.offsetY };
  history.push(ink.toDataURL()); if (history.length > 20) history.shift();
  ink.setPointerCapture(e.pointerId);
  dot(e);
});
ink.addEventListener('pointermove', (e) => {
  if (!drawing) return;
  const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  events.forEach((ev) => line(ev));
});
['pointerup', 'pointercancel'].forEach((t) => ink.addEventListener(t, () => { if (drawing) { drawing = false; persist(); } }));

function stroke(e) {
  const p = e.pointerType === 'pen' && e.pressure ? 0.4 + e.pressure : 1;
  ctx.globalCompositeOperation = erasing ? 'destination-out' : 'source-over';
  ctx.strokeStyle = ctx.fillStyle = color;
  ctx.lineWidth = (erasing ? 28 : width) * p;
  ctx.lineCap = ctx.lineJoin = 'round';
}
function dot(e) { stroke(e); ctx.beginPath(); ctx.arc(e.offsetX, e.offsetY, ctx.lineWidth / 2, 0, Math.PI * 2); ctx.fill(); }
function line(e) {
  stroke(e);
  ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke();
  last = { x: e.offsetX, y: e.offsetY };
}

function restore(data) {
  const { width: w, height: h } = board.getBoundingClientRect();
  ctx.clearRect(0, 0, w, h);
  if (!data) return persist();
  const img = new Image();
  img.onload = () => { ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.globalCompositeOperation = 'source-over'; ctx.drawImage(img, 0, 0); ctx.restore(); persist(); };
  img.src = data;
}

document.querySelectorAll('.sw').forEach((b) => b.onclick = () => {
  document.querySelectorAll('.sw').forEach((x) => x.classList.remove('on'));
  b.classList.add('on'); color = b.dataset.c; erasing = false;
  document.getElementById('eraser').classList.remove('on');
});
const thin = document.getElementById('thin'), thick = document.getElementById('thick');
thin.onclick = () => { width = 1.8; thin.classList.add('on'); thick.classList.remove('on'); };
thick.onclick = () => { width = 3.5; thick.classList.add('on'); thin.classList.remove('on'); };
document.getElementById('eraser').onclick = (e) => { erasing = !erasing; e.currentTarget.classList.toggle('on', erasing); };
document.getElementById('undo').onclick = () => { if (history.length) restore(history.pop()); };
document.getElementById('clear').onclick = () => { history.push(ink.toDataURL()); restore(null); };
document.getElementById('tplBtn').onclick = () => { showTpl = !showTpl; localStorage.setItem(KEY + '.tpl', showTpl ? '1' : '0'); drawTemplate(); };

new ResizeObserver(resize).observe(board);
</script>
</body>
</html>
