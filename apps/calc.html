<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Wind & Conversions</title>
<link href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=B612+Mono&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#050b14; --panel:#0e1e33; --panel2:#132a46; --line:#1f3d63; --text:#e6f1ff; --dim:#7f97b5;
          --cyan:#19d3ff; --amber:#ffb300; --green:#2dff6e; --magenta:#ff4dff; --font:"B612",system-ui,sans-serif; --mono:"B612 Mono",monospace; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:var(--font); }
  .page { display:grid; grid-template-columns:1fr 1fr; gap:18px; padding:18px; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
  h2 { margin:0 0 14px; font-size:15px; letter-spacing:3px; color:var(--dim); font-weight:400; }
  h2::before { content:"■ "; color:var(--cyan); }
  .fields { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }

  /* SimBrief Active Flight Banner */
  .sb-flight-bar {
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
    background:rgba(25,211,255,0.06); border:1px solid rgba(25,211,255,0.25);
    border-radius:8px; padding:8px 12px; margin-bottom:12px;
  }
  .sfb-info { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .sfb-badge {
    background:var(--cyan); color:var(--bg); font-size:10px; font-weight:700;
    letter-spacing:1px; padding:3px 7px; border-radius:4px;
  }
  .sfb-route { font-family:var(--mono); font-size:13px; color:var(--text); font-weight:700; }
  .sfb-buttons { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .btn-sfb {
    background:var(--panel2); color:var(--cyan); border:1px solid var(--cyan);
    border-radius:6px; padding:6px 12px; font-family:var(--mono); font-size:12px;
    font-weight:700; cursor:pointer;
  }
  .btn-sfb:active { background:rgba(25,211,255,0.2); }
  .btn-sfb-icon {
    background:var(--panel); color:var(--cyan); border:1px solid var(--line);
    border-radius:6px; padding:6px 12px; font-size:15px; cursor:pointer; font-weight:700;
    display:inline-flex; align-items:center; justify-content:center; min-width:34px;
  }
  .btn-sfb-icon:active { background:var(--panel2); border-color:var(--cyan); }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  .btn-sfb-icon.loading { animation: spin 0.8s linear infinite; opacity: 0.7; pointer-events: none; }

  .metar-bar {
    display:flex; gap:10px; align-items:flex-end; margin-bottom:12px; flex-wrap:wrap;
  }
  .metar-bar .icao-wrap { display:flex; gap:8px; align-items:flex-end; }
  .metar-bar input#icao { width:130px; height:48px; text-transform:uppercase; letter-spacing:2px; padding:0 10px; }
  .btn-metar {
    height:48px; padding:0 18px; border-radius:8px; border:1px solid var(--amber);
    background:var(--panel2); color:var(--amber); font-family:var(--font);
    font-size:12px; letter-spacing:2px; cursor:pointer; white-space:nowrap;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .btn-metar:active { background:rgba(255,179,0,.18); }
  .btn-metar:disabled { opacity:.5; cursor:default; }

  .metar-box {
    flex:1; min-width:240px; min-height:48px; background:var(--bg); border:1px solid var(--line);
    border-radius:8px; padding:8px 12px; display:flex; align-items:center; gap:10px;
    font-family:var(--mono); font-size:13px; color:var(--green); word-break:break-word;
  }
  .metar-box.empty { color:var(--dim); font-size:12px; }
  .metar-box.err { color:#ff3b3b; border-color:#ff3b3b; }
  .wx-cat {
    padding:3px 7px; border-radius:4px; font-size:10px; font-weight:700; letter-spacing:1px;
    background:var(--green); color:var(--bg); flex:0 0 auto;
  }
  .wx-cat.MVFR { background:var(--cyan); }
  .wx-cat.IFR { background:var(--amber); }
  .wx-cat.LIFR { background:var(--magenta); color:#fff; }
  .atis-box {
    background:var(--bg); border:1px solid var(--line); border-radius:8px;
    padding:10px 12px; margin-bottom:12px; font-family:var(--mono); font-size:12px;
    color:var(--cyan); line-height:1.45;
  }
  .atis-head {
    display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap;
  }
  .atis-src {
    display:inline-block; padding:3px 7px; border-radius:4px; font-size:10px; font-weight:700;
    letter-spacing:1px; background:var(--green); color:var(--bg);
  }
  .atis-src.real { background:var(--amber); color:var(--bg); }
  .atis-src.stale { background:#ff3b3b; color:#fff; }
  .atis-time { font-size:10px; color:var(--dim); letter-spacing:1px; }
  .atis-tabs { display:flex; gap:6px; flex-wrap:wrap; }
  .atis-tab {
    background:var(--panel); color:var(--dim); border:1px solid var(--line);
    border-radius:6px; padding:5px 12px; font-family:var(--font); font-size:11px;
    font-weight:700; letter-spacing:1.5px; cursor:pointer;
  }
  .atis-tab.active {
    background:var(--panel2); color:var(--cyan); border-color:var(--cyan);
    box-shadow:inset 0 -2px 0 var(--cyan);
  }
  .atis-body {
    white-space:pre-wrap; max-height:140px; overflow-y:auto; color:var(--cyan);
  }

  .rwy-picker-wrap { margin-bottom:12px; }
  .rwy-picker {
    display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px;
  }
  .rwy-picker .rp-label { font-size:10px; letter-spacing:2px; color:var(--dim); margin-right:4px; }
  .rwy-btn {
    background:var(--bg); color:var(--cyan); border:1px solid var(--line);
    border-radius:8px; padding:8px 14px; font-family:var(--mono); font-size:14px;
    cursor:pointer; display:inline-flex; align-items:center; gap:7px;
  }
  .rwy-btn.best { border-color:rgba(45,255,110,.55); }
  .rwy-btn.active {
    background:var(--panel2); color:var(--green); border-color:var(--green);
    box-shadow:inset 0 -3px 0 var(--green);
  }

  label { display:flex; flex-direction:column; gap:5px; font-size:10px; letter-spacing:2px; color:var(--dim); }
  input { width:100%; font-family:var(--mono); font-size:22px; color:var(--cyan); background:var(--bg);
          border:1px solid var(--line); border-radius:8px; padding:10px; text-align:center; }
  input:focus { outline:none; border-color:var(--amber); color:var(--amber); }
  .wind-out { display:flex; gap:16px; align-items:center; margin-top:16px; }
  svg { width:180px; height:180px; flex:0 0 auto; }
  .res { flex:1; display:flex; flex-direction:column; gap:10px; }
  .res div { display:flex; justify-content:space-between; align-items:baseline; font-family:var(--mono);
             border-bottom:1px solid var(--line); padding-bottom:6px; }
  .res .k { font-size:11px; letter-spacing:2px; color:var(--dim); }
  .res .v { font-size:24px; color:var(--green); }
  .res .v.warn { color:var(--amber); }
  .conv { display:grid; grid-template-columns:1fr auto 1fr; gap:8px 10px; align-items:end; }
  .conv .eq { color:var(--dim); padding-bottom:14px; }
  .fuel { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .wide { grid-column:1 / -1; }
  @media (max-width:820px) { .page { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="page">
  <section class="wide">
    <h2>WIND COMPONENTS, METAR & ATIS</h2>

    <!-- Active SimBrief Flight Banner -->
    <div class="sb-flight-bar" id="sbFlightBar" hidden>
      <div class="sfb-info">
        <span class="sfb-badge">NAVIGRAPH / SIMBRIEF</span>
        <span class="sfb-route" id="sfbRoute">—</span>
      </div>
      <div class="sfb-buttons">
        <button type="button" class="btn-sfb" id="btnLoadDep" title="Load Departure Airport and Runway">DEP: <span id="sfbDepTxt">—</span></button>
        <button type="button" class="btn-sfb" id="btnLoadArr" title="Load Arrival Airport and Runway">ARR: <span id="sfbArrTxt">—</span></button>
        <button type="button" class="btn-sfb-icon" id="btnRefreshFlight" title="Refresh SimBrief flight & update top-left callsign">↻</button>
      </div>
    </div>

    <div class="metar-bar">
      <div class="icao-wrap">
        <label>AIRPORT (ICAO)<input id="icao" maxlength="4" placeholder="ICAO" value="" /></label>
        <button type="button" class="btn-metar" id="btnFetchMetar">GET METAR</button>
      </div>
      <div class="metar-box empty" id="metarBox">
        <span id="wxCat" class="wx-cat" hidden>VFR</span>
        <span id="metarText">Enter an ICAO airport code and tap GET METAR to pull live METAR & ATIS.</span>
      </div>
    </div>
    <div class="atis-box" id="atisBox" hidden></div>

    <div class="rwy-picker-wrap">
      <div class="rwy-picker" id="rwyPicker" hidden>
        <span class="rp-label" id="rpLabel">SELECT RUNWAY:</span>
        <div id="rwyButtons" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;"></div>
      </div>
    </div>

    <div class="wind-out">
      <svg viewBox="-100 -100 200 200" aria-hidden="true">
        <circle r="92" fill="none" stroke="#1f3d63" stroke-width="2" />
        <text y="-78" text-anchor="middle" fill="#7f97b5" font-size="12" font-family="B612 Mono">RWY</text>
        <rect x="-11" y="-60" width="22" height="120" fill="#22344d" stroke="#e6f1ff" stroke-width="2" />
        <line x1="0" y1="-50" x2="0" y2="40" stroke="#e6f1ff" stroke-width="2" stroke-dasharray="8 8" />
        <text id="rwyNum" y="76" text-anchor="middle" fill="#e6f1ff" font-size="13" font-family="B612 Mono"></text>
        <g id="windArrows" visibility="hidden">
          <g id="hwGroup">
            <line id="hwShaft" x1="-64" y1="-24" x2="-64" y2="6" stroke="#2dff6e" stroke-width="3.5" stroke-linecap="square" />
            <polygon id="hwHead" points="-64,14 -70,4 -58,4" fill="#2dff6e" />
            <text id="hwNum" x="-64" y="30" text-anchor="middle" fill="#2dff6e" font-size="13" font-weight="700" font-family="B612 Mono">0</text>
          </g>
          <g id="xwGroup">
            <line id="xwShaft" x1="-64" y1="-24" x2="-40" y2="-24" stroke="#2dff6e" stroke-width="3.5" stroke-linecap="square" />
            <polygon id="xwHead" points="-32,-24 -42,-30 -42,-18" fill="#2dff6e" />
            <text id="xwNum" x="-22" y="-20" text-anchor="middle" fill="#2dff6e" font-size="13" font-weight="700" font-family="B612 Mono">0</text>
          </g>
        </g>
      </svg>
      <div class="res">
        <div><span class="k" id="hwK">HEADWIND</span><span class="v" id="hw">—</span></div>
        <div><span class="k" id="xwK">CROSSWIND</span><span class="v" id="xw">—</span></div>
        <div><span class="k">GUST HW / XW</span><span class="v" id="gust">—</span></div>
      </div>
    </div>
  </section>

  <section>
    <h2>UNIT CONVERSIONS</h2>
    <div class="conv" id="conv"></div>
  </section>

  <section>
    <h2>FUEL VOLUME ⇄ MASS</h2>
    <div class="fuel">
      <label>LITRES<input id="fL" inputmode="decimal" /></label>
      <label>US GAL<input id="fG" inputmode="decimal" /></label>
      <label>KG<input id="fKg" inputmode="decimal" /></label>
      <label>LB<input id="fLb" inputmode="decimal" /></label>
      <label class="wide">DENSITY KG/L (Jet A-1 ≈ 0.80)<input id="fD" inputmode="decimal" value="0.80" /></label>
    </div>
  </section>
</div>
<script>
const $ = (id) => document.getElementById(id);
const num = (el) => parseFloat(String(el.value).replace(',', '.'));
const rad = (d) => d * Math.PI / 180;
const LS_LAST_ICAO = 'efb.calc.lastIcao.v1';
const LS_RWY_OVERRIDES = 'efb.calc.rwyOverrides.v1';

let runwaysDB = {};
let currentAirportRunways = []; // [{ ident: '26L', hdg: 257, defaultHdg: 257 }, ...]
let selectedRwyIdent = '';
let windDir = NaN, windSpd = NaN, windGst = NaN;

function getOverrides() {
  try {
    return JSON.parse(localStorage.getItem(LS_RWY_OVERRIDES) || '{}');
  } catch {
    return {};
  }
}

function getSimbriefId() {
  try {
    const raw = (window.parent && window.parent.localStorage ? window.parent.localStorage.getItem('efb.settings.v1') : localStorage.getItem('efb.settings.v1'));
    if (raw) {
      const s = JSON.parse(raw);
      if (s && s.simbriefId) return String(s.simbriefId).trim();
    }
  } catch {}
  return '';
}

// Restore last entered airport
const savedIcao = localStorage.getItem(LS_LAST_ICAO) || '';
$('icao').value = savedIcao;

/* ---------- wind ---------- */
function wind() {
  const matchRwy = currentAirportRunways.find((r) => r.ident === selectedRwyIdent) || currentAirportRunways[0];
  const hdg = matchRwy ? matchRwy.hdg : NaN;
  if (matchRwy) selectedRwyIdent = matchRwy.ident;
  $('rwyNum').textContent = matchRwy ? matchRwy.ident : '—';

  const dir = windDir, spd = windSpd, gst = windGst;
  if ([hdg, dir, spd].some(isNaN)) {
    ['hw', 'xw', 'gust'].forEach((i) => ($(i).textContent = '—'));
    $('windArrows').setAttribute('visibility', 'hidden');
    renderRunwayButtons();
    return;
  }
  const ang = rad(dir - hdg);
  const hw = spd * Math.cos(ang), xw = spd * Math.sin(ang);
  $('hwK').textContent = hw >= 0 ? 'HEADWIND' : 'TAILWIND';
  $('hw').textContent = Math.abs(hw).toFixed(0) + ' KT';
  $('hw').classList.toggle('warn', hw < -0.5);
  $('xwK').textContent = 'CROSSWIND ' + (Math.abs(xw) < 0.5 ? '' : xw > 0 ? 'FROM RIGHT' : 'FROM LEFT');
  $('xw').textContent = Math.abs(xw).toFixed(0) + ' KT';
  $('xw').classList.toggle('warn', Math.abs(xw) >= 20);
  if (!isNaN(gst)) {
    $('gust').textContent = `${(gst * Math.cos(ang)).toFixed(0)} / ${Math.abs(gst * Math.sin(ang)).toFixed(0)} KT`;
  } else $('gust').textContent = '—';

  const hwAbs = Math.round(Math.abs(hw));
  const xwAbs = Math.round(Math.abs(xw));
  const isTailwind = hw < -0.5;
  const fromRight = xw > 0;
  const cx = fromRight ? 64 : -64;
  const cy = isTailwind ? 24 : -24;
  const hwColor = isTailwind ? '#ff4d5e' : '#2dff6e';
  const xwColor = Math.abs(xw) >= 20 ? '#ff4d5e' : '#2dff6e';

  $('windArrows').setAttribute('visibility', (hwAbs === 0 && xwAbs === 0) ? 'hidden' : 'visible');

  // Vertical Headwind / Tailwind arrow
  $('hwGroup').setAttribute('visibility', hwAbs === 0 ? 'hidden' : 'visible');
  if (hwAbs > 0) {
    const tipY = isTailwind ? -14 : 14;
    const shaftEndY = isTailwind ? -6 : 6;
    const basePts = isTailwind
      ? `${cx},${tipY} ${cx - 6},${tipY + 10} ${cx + 6},${tipY + 10}`
      : `${cx},${tipY} ${cx - 6},${tipY - 10} ${cx + 6},${tipY - 10}`;
    $('hwShaft').setAttribute('x1', cx);
    $('hwShaft').setAttribute('y1', cy);
    $('hwShaft').setAttribute('x2', cx);
    $('hwShaft').setAttribute('y2', shaftEndY);
    $('hwShaft').setAttribute('stroke', hwColor);
    $('hwHead').setAttribute('points', basePts);
    $('hwHead').setAttribute('fill', hwColor);
    $('hwNum').setAttribute('x', cx);
    $('hwNum').setAttribute('y', isTailwind ? -22 : 30);
    $('hwNum').setAttribute('fill', hwColor);
    $('hwNum').textContent = hwAbs;
  }

  // Horizontal Crosswind arrow
  $('xwGroup').setAttribute('visibility', xwAbs === 0 ? 'hidden' : 'visible');
  if (xwAbs > 0) {
    const tipX = fromRight ? 32 : -32;
    const shaftEndX = fromRight ? 40 : -40;
    const xwPts = fromRight
      ? `${tipX},${cy} ${tipX + 10},${cy - 6} ${tipX + 10},${cy + 6}`
      : `${tipX},${cy} ${tipX - 10},${cy - 6} ${tipX - 10},${cy + 6}`;
    $('xwShaft').setAttribute('x1', cx);
    $('xwShaft').setAttribute('y1', cy);
    $('xwShaft').setAttribute('x2', shaftEndX);
    $('xwShaft').setAttribute('y2', cy);
    $('xwShaft').setAttribute('stroke', xwColor);
    $('xwHead').setAttribute('points', xwPts);
    $('xwHead').setAttribute('fill', xwColor);
    $('xwNum').setAttribute('x', fromRight ? 22 : -22);
    $('xwNum').setAttribute('y', cy + 4);
    $('xwNum').setAttribute('fill', xwColor);
    $('xwNum').textContent = xwAbs;
  }

  renderRunwayButtons();
}

function updateAirportRunways(autoPickBest = false) {
  const code = ($('icao').value || '').trim().toUpperCase();
  const dbList = runwaysDB[code] || [];
  const overrides = getOverrides();

  currentAirportRunways = dbList.map((entry) => {
    const [ident, h] = entry.split(':');
    const defaultH = parseInt(h, 10);
    const ov = overrides[`${code}:${ident}`];
    return {
      ident,
      defaultHdg: defaultH,
      hdg: (typeof ov === 'number' && !isNaN(ov)) ? ov : defaultH,
    };
  });

  $('rwyPicker').hidden = currentAirportRunways.length === 0;

  if (currentAirportRunways.length === 0) {
    $('rpLabel').textContent = code ? `NO RUNWAYS FOR ${code}:` : 'SELECT RUNWAY:';
    selectedRwyIdent = '';
    wind();
    return;
  }

  $('rpLabel').textContent = 'SELECT RUNWAY:';

  if (autoPickBest && !isNaN(windDir)) {
    let best = currentAirportRunways[0], bestCos = -2;
    for (const r of currentAirportRunways) {
      const c = Math.cos(rad(windDir - r.hdg));
      if (c > bestCos) { bestCos = c; best = r; }
    }
    selectedRwyIdent = best.ident;
  } else if (!currentAirportRunways.some((r) => r.ident === selectedRwyIdent)) {
    selectedRwyIdent = currentAirportRunways[0].ident;
  }
  wind();
}

function renderRunwayButtons() {
  const wrap = $('rwyButtons');
  if (!wrap) return;
  wrap.textContent = '';
  let bestIdent = null, bestCos = -2;
  if (!isNaN(windDir)) {
    for (const r of currentAirportRunways) {
      const c = Math.cos(rad(windDir - r.hdg));
      if (c > bestCos) { bestCos = c; bestIdent = r.ident; }
    }
  }
  currentAirportRunways.forEach((r) => {
    const b = document.createElement('button');
    b.type = 'button';
    const isAct = r.ident === selectedRwyIdent;
    const isBest = r.ident === bestIdent;
    b.className = 'rwy-btn' + (isAct ? ' active' : '') + (isBest ? ' best' : '');
    b.textContent = `RWY ${r.ident}`;
    b.onclick = () => {
      selectedRwyIdent = r.ident;
      wind();
    };
    wrap.appendChild(b);
  });
}

$('icao').addEventListener('input', () => {
  const val = ($('icao').value || '').trim().toUpperCase();
  localStorage.setItem(LS_LAST_ICAO, val);
  updateAirportRunways(false);
});

/* ---------- SimBrief / Navigraph active flight integration ---------- */
function loadStoredSimbriefFlight() {
  const simbriefId = getSimbriefId();
  if (!simbriefId) {
    try {
      localStorage.removeItem('efb.simbrief.activeFlight');
      if (window.parent && window.parent.localStorage) {
        window.parent.localStorage.removeItem('efb.simbrief.activeFlight');
      }
    } catch {}
    renderSimbriefFlightBar(null);
    return;
  }
  let flight = null;
  try {
    const raw = (window.parent && window.parent.localStorage ? window.parent.localStorage.getItem('efb.simbrief.activeFlight') : localStorage.getItem('efb.simbrief.activeFlight'));
    if (raw) flight = JSON.parse(raw);
  } catch {}
  renderSimbriefFlightBar(flight);
}

function renderSimbriefFlightBar(flight) {
  const bar = $('sbFlightBar');
  if (!flight || (!flight.orig && !flight.dest)) {
    bar.hidden = true;
    return;
  }
  bar.hidden = false;
  const cs = flight.callsign ? flight.callsign + ' · ' : '';
  $('sfbRoute').textContent = `${cs}${flight.orig || '???'} → ${flight.dest || '???'}`;
  $('sfbDepTxt').textContent = (flight.orig || '—') + (flight.origRwy ? ` (${flight.origRwy})` : '');
  $('sfbArrTxt').textContent = (flight.dest || '—') + (flight.destRwy ? ` (${flight.destRwy})` : '');

  // Apply any Navigraph runways from flight plan into local overrides
  if (flight.runways && Object.keys(flight.runways).length > 0) {
    const ov = getOverrides();
    let changed = false;
    for (const [k, v] of Object.entries(flight.runways)) {
      if (ov[k] !== v) { ov[k] = v; changed = true; }
    }
    if (changed) {
      try { localStorage.setItem(LS_RWY_OVERRIDES, JSON.stringify(ov)); } catch {}
    }
  }
}

async function syncSimbrief() {
  let id = getSimbriefId();
  if (!id) {
    const entered = prompt('Please enter your SimBrief Pilot ID or Username:');
    if (entered && entered.trim()) {
      id = entered.trim();
      try {
        if (window.parent && window.parent.localStorage) {
          const s = JSON.parse(window.parent.localStorage.getItem('efb.settings.v1') || '{}');
          s.simbriefId = id;
          window.parent.localStorage.setItem('efb.settings.v1', JSON.stringify(s));
        }
        const s = JSON.parse(localStorage.getItem('efb.settings.v1') || '{}');
        s.simbriefId = id;
        localStorage.setItem('efb.settings.v1', JSON.stringify(s));
      } catch {}
    }
  }
  if (!id) return;

  const btn = $('btnRefreshFlight');
  if (btn) btn.classList.add('loading');

  try {
    const param = /^\d+$/.test(id) ? `userid=${encodeURIComponent(id)}` : `username=${encodeURIComponent(id)}`;
    const url = `https://www.simbrief.com/api/xml.fetcher.php?${param}&json=1&t=${Date.now()}`;
    let data = null;

    if (window.parent && window.parent.EFBNative && typeof window.parent.EFBNative.fetchUrl === 'function') {
      try {
        data = JSON.parse(window.parent.EFBNative.fetchUrl(url));
      } catch {}
    }
    if (!data) {
      const urls = [url, `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`];
      for (const u of urls) {
        try {
          const r = await fetch(u, { cache: 'no-store' });
          if (r.ok) { data = await r.json(); break; }
        } catch {}
      }
    }

    if (!data || data?.fetch?.status !== 'Success') {
      throw new Error(data?.fetch?.status || 'No active SimBrief flight plan found');
    }

    const cs = (
      (typeof data?.atc?.callsign === 'string' && data.atc.callsign.trim()) ||
      ((typeof data?.general?.icao_airline === 'string' ? data.general.icao_airline : '') +
       (typeof data?.general?.flight_number === 'string' ? data.general.flight_number : '')).trim() ||
      (typeof data?.aircraft?.reg === 'string' && data.aircraft.reg.trim()) ||
      ''
    ).toUpperCase();

    const orig = (data?.origin?.icao_code || data?.general?.orig || '').trim().toUpperCase();
    const origRwy = (data?.origin?.plan_rwy || data?.general?.origrwy || '').trim().toUpperCase();
    const dest = (data?.destination?.icao_code || data?.general?.dest || '').trim().toUpperCase();
    const destRwy = (data?.destination?.plan_rwy || data?.general?.destrwy || '').trim().toUpperCase();

    const toList = (x) => (!x ? [] : Array.isArray(x) ? x : [x]);
    const runwaysFound = {};
    toList(data?.tlr?.takeoff?.runway).forEach((r) => {
      const rid = (r.identifier || '').trim().toUpperCase();
      const mag = parseInt(r.magnetic_course || r.mag_course || r.heading_mag, 10);
      if (orig && rid && !isNaN(mag) && mag >= 1 && mag <= 360) runwaysFound[`${orig}:${rid}`] = mag;
    });
    toList(data?.tlr?.landing?.runway).forEach((r) => {
      const rid = (r.identifier || '').trim().toUpperCase();
      const mag = parseInt(r.magnetic_course || r.mag_course || r.heading_mag, 10);
      if (dest && rid && !isNaN(mag) && mag >= 1 && mag <= 360) runwaysFound[`${dest}:${rid}`] = mag;
    });

    // 1. Immediately update the callsign in the top left of the EFB header
    if (cs) {
      try {
        if (window.parent && window.parent.document) {
          const topCs = window.parent.document.getElementById('sbCallsign');
          if (topCs) topCs.textContent = cs;
          if (window.parent.settings) {
            window.parent.settings.callsign = cs;
            if (typeof window.parent.saveSettings === 'function') window.parent.saveSettings();
            if (typeof window.parent.applySettings === 'function') window.parent.applySettings();
          }
        }
      } catch {}

      try {
        const s = JSON.parse(localStorage.getItem('efb.settings.v1') || '{}');
        s.callsign = cs;
        localStorage.setItem('efb.settings.v1', JSON.stringify(s));
      } catch {}

      try {
        if (window.parent && typeof window.parent.postMessage === 'function') {
          window.parent.postMessage({ type: 'simbrief-callsign-updated', callsign: cs }, '*');
        }
      } catch {}
    }

    // 2. Store active flight data
    const flightInfo = { callsign: cs, orig, origRwy, dest, destRwy, runways: runwaysFound, updatedAt: Date.now() };
    try {
      if (window.parent && window.parent.localStorage) {
        window.parent.localStorage.setItem('efb.simbrief.activeFlight', JSON.stringify(flightInfo));
      }
      localStorage.setItem('efb.simbrief.activeFlight', JSON.stringify(flightInfo));
    } catch {}

    renderSimbriefFlightBar(flightInfo);

    // If currently looking at departure or arrival, re-sync runways & weather
    const curIcao = ($('icao').value || '').trim().toUpperCase();
    if (!curIcao && orig) {
      loadAirportAndRunway(orig, origRwy);
    } else if (curIcao === orig && origRwy) {
      selectedRwyIdent = origRwy;
      updateAirportRunways(false);
    } else if (curIcao === dest && destRwy) {
      selectedRwyIdent = destRwy;
      updateAirportRunways(false);
    }
  } catch (err) {
    alert('SimBrief: ' + (err.message || 'Could not fetch flight plan'));
  } finally {
    if (btn) btn.classList.remove('loading');
  }
}

/* ---------- live VATSIM ATIS first, fallback to real-life D-ATIS (atis.guru) ---------- */
function getAtisAgeInfo(rawText, subtitleText = '') {
  let zuluTime = '';
  let zuluAge = null;
  const zm = rawText.match(/\b([01]\d|2[0-3])([0-5]\d)Z\b/);
  if (zm) {
    zuluTime = `${zm[1]}${zm[2]}Z`;
    const now = new Date();
    const nowMin = now.getUTCHours() * 60 + now.getUTCMinutes();
    const atisMin = parseInt(zm[1], 10) * 60 + parseInt(zm[2], 10);
    zuluAge = atisMin > nowMin + 5 ? (nowMin + 1440 - atisMin) : Math.max(0, nowMin - atisMin);
  }
  let subAge = null;
  if (subtitleText) {
    const sm = subtitleText.match(/(\d{4}-\d{2}-\d{2})\s+(\d{2}:\d{2})\s*UTC/i);
    if (sm) {
      const ts = Date.parse(`${sm[1]}T${sm[2]}:00Z`);
      if (!isNaN(ts)) subAge = Math.max(0, Math.round((Date.now() - ts) / 60000));
    }
  }
  const ageMins = (zuluAge !== null && subAge !== null)
    ? Math.max(zuluAge, subAge)
    : (zuluAge !== null ? zuluAge : subAge);
  return { zuluTime, ageMins };
}

function classifyAtisItem(rawText, callsign = '', infoCode = '', freq = '', subtitleText = '') {
  const lines = rawText.split(/\n+/).map((l) => l.trim()).filter(Boolean);
  let body;
  if (lines.length > 1 && /^[A-Z0-9]{4}\s+(ARR|DEP|COM)?\s*ATIS\b/i.test(lines[0])) {
    body = lines[0] + ' — ' + lines.slice(1).join(' ').replace(/\s{2,}/g, ' ');
  } else {
    body = lines.join(' ').replace(/\s{2,}/g, ' ');
  }

  let type = 'ATIS';
  if (/_A_ATIS$/i.test(callsign) || /\bARR(IVAL)?\s+ATIS\b/i.test(rawText)) type = 'ARR ATIS';
  else if (/_D_ATIS$/i.test(callsign) || /\bDEP(ARTURE)?\s+ATIS\b/i.test(rawText)) type = 'DEP ATIS';

  let letter = infoCode || '';
  if (!letter) {
    const m = rawText.match(/\b(?:ATIS(?:\s+INFO(?:RMATION)?)?|INFORMATION)\s+([A-Z])\b/i);
    if (m) letter = m[1].toUpperCase();
  }

  const { zuluTime, ageMins } = getAtisAgeInfo(rawText, subtitleText);
  const label = letter ? `${type} (${letter})` : type;
  const prefix = [callsign, freq ? `${freq}` : ''].filter(Boolean).join(' · ');
  return {
    type,
    label,
    zuluTime,
    ageMins,
    text: prefix ? `${prefix} — ${body}` : body,
  };
}

async function fetchVatsimAtis(code) {
  try {
    const r = await fetch(`https://data.vatsim.net/v3/vatsim-data.json?t=${Date.now()}`, { cache: 'no-store' });
    if (!r.ok) return [];
    const data = await r.json();
    const matches = (data.atis || []).filter(
      (a) => a.callsign && a.callsign.toUpperCase().startsWith(code + '_') && Array.isArray(a.text_atis) && a.text_atis.length > 0
    );
    return matches.map((a) =>
      classifyAtisItem(a.text_atis.join(' '), a.callsign, a.atis_code || '', a.frequency || '')
    );
  } catch {
    return [];
  }
}

function parseAtisGuruHtml(html) {
  if (!html || !html.includes('class="atis"')) return [];
  try {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const els = [...doc.querySelectorAll('div.atis')];
    doc.querySelectorAll('template').forEach((tpl) => {
      els.push(...tpl.content.querySelectorAll('div.atis'));
    });
    const blocks = els
      .map((el) => {
        const text = el.textContent.replace(/\r/g, '').replace(/[ \t]+\n/g, '\n').trim();
        const card = el.closest('.card-body');
        const sub = card ? (card.querySelector('.card-subtitle')?.textContent || '').trim() : '';
        return { text, sub };
      })
      .filter((b) => b.text && !/^(METAR|TAF)\b/i.test(b.text));
    if (blocks.length) {
      return blocks
        .map((b) => classifyAtisItem(b.text, '', '', '', b.sub))
        .filter((item) => item.ageMins === null || item.ageMins <= 360);
    }
  } catch {}
  return [];
}

async function fetchAtisGuru(code) {
  const targetUrl = `https://atis.guru/atis/${encodeURIComponent(code)}`;

  if (window.parent && window.parent.EFBNative && typeof window.parent.EFBNative.fetchUrl === 'function') {
    try {
      const html = window.parent.EFBNative.fetchUrl(targetUrl);
      const parsed = parseAtisGuruHtml(html);
      if (parsed.length > 0) return parsed;
    } catch {}
  }

  let pcBase = '';
  try {
    pcBase = (window.parent && window.parent.localStorage ? window.parent.localStorage.getItem('efb.pcBase') : localStorage.getItem('efb.pcBase')) || '';
    if (pcBase) {
      pcBase = pcBase.trim().replace(/\/$/, '');
      if (!/^https?:\/\//i.test(pcBase)) pcBase = 'http://' + pcBase;
    }
  } catch {}

  const serverApi = pcBase
    ? `${pcBase}/api/atis?icao=${encodeURIComponent(code)}&t=${Date.now()}`
    : `../api/atis?icao=${encodeURIComponent(code)}&t=${Date.now()}`;

  const urls = [
    serverApi,
    targetUrl,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
  ];
  for (const u of urls) {
    try {
      const r = await fetch(u, { cache: 'no-store' });
      if (!r.ok) continue;
      const html = await r.text();
      const parsed = parseAtisGuruHtml(html);
      if (parsed.length > 0) return parsed;
    } catch {}
  }
  return [];
}

function parseFaaDatisJson(raw) {
  try {
    const arr = JSON.parse(raw);
    if (!Array.isArray(arr) || !arr.length) return [];
    return arr
      .filter((d) => d && d.datis && !d.error)
      .map((d) => {
        const item = classifyAtisItem(d.datis, '', d.code || '', '');
        const t = d.type === 'arr' ? 'ARR ATIS' : (d.type === 'dep' ? 'DEP ATIS' : item.type);
        const letter = (d.code || '').toUpperCase();
        item.type = t;
        item.label = letter ? `${t} (${letter})` : t;
        return item;
      });
  } catch {
    return [];
  }
}

async function fetchFaaDatis(code) {
  if (!/^[KP][A-Z0-9]{3}$/.test(code)) return [];
  const targetUrl = `https://datis.clowd.io/api/${encodeURIComponent(code)}`;

  if (window.parent && window.parent.EFBNative && typeof window.parent.EFBNative.fetchUrl === 'function') {
    try {
      const parsed = parseFaaDatisJson(window.parent.EFBNative.fetchUrl(targetUrl));
      if (parsed.length > 0) return parsed;
    } catch {}
  }

  const urls = [
    targetUrl,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
  ];
  for (const u of urls) {
    try {
      const r = await fetch(u, { cache: 'no-store' });
      if (!r.ok) continue;
      const parsed = parseFaaDatisJson(await r.text());
      if (parsed.length > 0) return parsed;
    } catch {}
  }
  return [];
}

async function fetchBestAtis(code) {
  const vatsimItems = await fetchVatsimAtis(code);
  if (vatsimItems.length > 0) {
    return { source: 'vatsim', items: vatsimItems };
  }
  const faaItems = await fetchFaaDatis(code);
  if (faaItems.length > 0) {
    return { source: 'real', items: faaItems };
  }
  const realItems = await fetchAtisGuru(code);
  if (realItems.length > 0) {
    return { source: 'real', items: realItems };
  }
  return { source: 'none', items: [] };
}

let currentAtisTab = 0;
function renderAtisResult(result) {
  const box = $('atisBox');
  box.textContent = '';
  if (!result || !result.items || !result.items.length) {
    box.hidden = true;
    return;
  }
  if (currentAtisTab >= result.items.length) currentAtisTab = 0;

  const head = document.createElement('div');
  head.className = 'atis-head';

  const badge = document.createElement('span');
  badge.className = 'atis-src' + (result.source === 'real' ? ' real' : '');
  badge.textContent = result.source === 'vatsim' ? 'VATSIM ATIS' : 'REAL D-ATIS (NO VATSIM ATIS)';
  head.appendChild(badge);

  const active = result.items[currentAtisTab];
  if (result.source === 'real' && active.ageMins !== null && active.ageMins >= 120) {
    const hrs = Math.floor(active.ageMins / 60);
    const staleBadge = document.createElement('span');
    staleBadge.className = 'atis-src stale';
    staleBadge.textContent = `STALE (${hrs}h OLD — MAY NOT MATCH METAR)`;
    head.appendChild(staleBadge);
  }
  if (active.zuluTime) {
    const timeEl = document.createElement('span');
    timeEl.className = 'atis-time';
    timeEl.textContent = active.zuluTime;
    head.appendChild(timeEl);
  }

  const tabs = document.createElement('div');
  tabs.className = 'atis-tabs';
  result.items.forEach((item, idx) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'atis-tab' + (idx === currentAtisTab ? ' active' : '');
    b.textContent = item.label;
    b.onclick = () => {
      currentAtisTab = idx;
      renderAtisResult(result);
    };
    tabs.appendChild(b);
  });
  head.appendChild(tabs);

  const body = document.createElement('div');
  body.className = 'atis-body';
  body.textContent = result.items[currentAtisTab].text;

  box.append(head, body);
  box.hidden = false;
}

async function fetchMetar() {
  const code = ($('icao').value || '').trim().toUpperCase();
  const box = $('metarBox'), txt = $('metarText'), cat = $('wxCat'), btn = $('btnFetchMetar');
  if (!/^[A-Z0-9]{3,4}$/.test(code)) {
    box.className = 'metar-box err';
    cat.hidden = true;
    $('atisBox').hidden = true;
    txt.textContent = 'Please enter a valid 4-letter ICAO code (e.g. EGKK).';
    return;
  }
  localStorage.setItem(LS_LAST_ICAO, code);
  btn.disabled = true;
  btn.textContent = 'LOADING...';
  box.className = 'metar-box empty';
  cat.hidden = true;
  $('atisBox').hidden = true;
  txt.textContent = `Fetching METAR & ATIS for ${code}...`;

  currentAtisTab = 0;
  fetchBestAtis(code).then((result) => {
    if (($('icao').value || '').trim().toUpperCase() === code) {
      renderAtisResult(result);
    }
  });

  try {
    let raw = '';
    try {
      const r = await fetch(`https://metar.vatsim.net/${encodeURIComponent(code)}?t=${Date.now()}`, { cache: 'no-store' });
      if (r.ok) raw = (await r.text()).trim();
    } catch {}
    if (!raw || raw.length < 10) {
      const url = `https://aviationweather.gov/api/data/metar?ids=${encodeURIComponent(code)}`;
      if (window.parent && window.parent.EFBNative && typeof window.parent.EFBNative.fetchUrl === 'function') {
        try { raw = window.parent.EFBNative.fetchUrl(url).trim(); } catch {}
      }
      if (!raw || raw.length < 10) {
        try {
          const r2 = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`, { cache: 'no-store' });
          if (r2.ok) raw = (await r2.text()).trim();
        } catch {}
      }
    }
    raw = (raw || '').split(/\r?\n/)[0].trim();
    if (!raw || !raw.startsWith(code)) {
      throw new Error(`No current METAR found for ${code}`);
    }

    box.className = 'metar-box';
    txt.textContent = raw;

    const wm = raw.match(/\b(\d{3}|VRB)(\d{2,3})(?:G(\d{2,3}))?(KT|MPS)\b/);
    if (wm) {
      const [, dir, spdStr, gstStr, unit] = wm;
      const factor = unit === 'MPS' ? 1.94384 : 1;
      windDir = dir !== 'VRB' ? parseInt(dir, 10) : 0;
      windSpd = Math.round(parseInt(spdStr, 10) * factor);
      windGst = gstStr ? Math.round(parseInt(gstStr, 10) * factor) : NaN;
      updateAirportRunways(true);
    } else {
      windDir = NaN; windSpd = NaN; windGst = NaN;
      updateAirportRunways(false);
    }

    const fc = parseFlightCat(raw);
    cat.textContent = fc;
    cat.className = 'wx-cat ' + fc;
    cat.hidden = false;
  } catch (err) {
    box.className = 'metar-box err';
    cat.hidden = true;
    txt.textContent = err.message || 'Could not fetch METAR.';
  } finally {
    btn.disabled = false;
    btn.textContent = 'GET METAR';
  }
}

function parseFlightCat(metar) {
  let cig = 99999;
  const clouds = metar.matchAll(/\b(BKN|OVC|VV)(\d{3})\b/g);
  for (const m of clouds) cig = Math.min(cig, parseInt(m[2], 10) * 100);
  let visMeters = 9999;
  if (/\bCAVOK\b/.test(metar)) visMeters = 9999;
  else {
    const sm = metar.match(/\b(\d+)\s*SM\b/);
    const m4 = metar.match(/\s(\d{4})\s/);
    if (sm) visMeters = parseFloat(sm[1]) * 1609.34;
    else if (m4) visMeters = parseInt(m4[1], 10);
  }
  if (cig < 500 || visMeters < 1600) return 'LIFR';
  if (cig < 1000 || visMeters < 4800) return 'IFR';
  if (cig <= 3000 || visMeters <= 8000) return 'MVFR';
  return 'VFR';
}

$('btnFetchMetar').addEventListener('click', fetchMetar);
$('icao').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); fetchMetar(); } });

/* ---------- unit conversions ---------- */
const PAIRS = [
  ['KG', 'LB', (x) => x * 2.20462, (x) => x / 2.20462],
  ['HPA', 'INHG', (x) => x / 33.8639, (x) => x * 33.8639, 2],
  ['°C', '°F', (x) => x * 9 / 5 + 32, (x) => (x - 32) * 5 / 9],
  ['M', 'FT', (x) => x * 3.28084, (x) => x / 3.28084],
  ['KM', 'NM', (x) => x / 1.852, (x) => x * 1.852],
  ['KT', 'KM/H', (x) => x * 1.852, (x) => x / 1.852],
  ['LITRES', 'US GAL', (x) => x / 3.78541, (x) => x * 3.78541],
];
const fmt = (v, dp = 1) => (isFinite(v) ? (+v.toFixed(dp)).toString() : '');
PAIRS.forEach(([a, b, toB, toA, dp]) => {
  const c = $('conv');
  const la = document.createElement('label'), lb = document.createElement('label'), eq = document.createElement('span');
  la.textContent = a; lb.textContent = b; eq.textContent = '⇄'; eq.className = 'eq';
  const ia = document.createElement('input'), ib = document.createElement('input');
  ia.inputMode = ib.inputMode = 'decimal';
  la.appendChild(ia); lb.appendChild(ib);
  ia.oninput = () => { ib.value = ia.value === '' ? '' : fmt(toB(num(ia)), dp ?? 1); };
  ib.oninput = () => { ia.value = ib.value === '' ? '' : fmt(toA(num(ib)), 1); };
  c.append(la, eq, lb);
});

/* ---------- fuel ---------- */
const USG = 3.78541, LB = 2.20462;
function fuelFrom(src) {
  const d = num($('fD')) || 0.8;
  let L;
  if (src === 'fL') L = num($('fL'));
  if (src === 'fG') L = num($('fG')) * USG;
  if (src === 'fKg') L = num($('fKg')) / d;
  if (src === 'fLb') L = num($('fLb')) / LB / d;
  if (src === 'fD') L = num($('fL'));
  const out = { fL: L, fG: L / USG, fKg: L * d, fLb: L * d * LB };
  for (const k in out) if (k !== src) $(k).value = isFinite(out[k]) ? Math.round(out[k]) : '';
}
['fL', 'fG', 'fKg', 'fLb', 'fD'].forEach((id) => $(id).addEventListener('input', () => fuelFrom(id)));
